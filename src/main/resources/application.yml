server:
  port: 8080

roleplay:
  llm:
    base-url: ${LLM_BASE_URL:https://10.21.16.197/v1/chat/completions}
    api-key: ${LLM_API_KEY:llama}
    model: ${LLM_MODEL:Qwen3.8-27B}
    temperature: 0.8
    max-tokens: 8192
    timeout-seconds: 120

  context:
    context-window-tokens: ${CONTEXT_WINDOW_TOKENS:193024}
    compaction-trigger-ratio: 0.70
    compaction-target-ratio: 0.50
    retained-turns: 10
    safety-tokens: 1024
    compaction-batch-input-tokens: 32768
    compaction-max-output-tokens: 8192
    summary-max-tokens: 4096
    compaction-max-batches: 8
    vision-grid-pixels: 32
    vision-min-grids: 9
    vision-token-multiplier: 1.10
    vision-token-overhead: 64

  vision:
    supported: ${ROLEPLAY_VISION_SUPPORTED:true}
    max-images: 5
    max-image-bytes: 10485760
    max-pixels: 20000000

  auxiliary:
    recent-turns: 4
    recent-history-tokens: 8192
    current-messages-tokens: 8192
    state-input-tokens: 32768
    selection-input-tokens: 32768
    catalog-entry-tokens: 2048
    correction-tokens: 2048

  dispatch:
    image-cache-bytes: 536870912
    image-idle-seconds: 1800
    image-lifetime-seconds: 7200
    task-timeout-seconds: 600
    result-retention-seconds: 7200
    max-results: 32
    result-cache-bytes: 67108864
    cleanup-seconds: 60
    selection-output-tokens: 4096
    state-output-tokens: 8192
