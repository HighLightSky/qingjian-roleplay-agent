server:
  port: 8080

roleplay:
  llm:
    base-url: ${LLM_BASE_URL:https://10.21.16.197/v1/chat/completions}
    api-key: ${LLM_API_KEY:llama}
    model: ${LLM_MODEL:Qwen3.8-27B}
    temperature: 0.8
    max-tokens: 8192
    timeout-seconds: 120

  vision:
    supported: ${ROLEPLAY_VISION_SUPPORTED:true}
    max-images: 4
    max-image-bytes: 10485760
    max-pixels: 20000000
    planning-input-chars: 48000
