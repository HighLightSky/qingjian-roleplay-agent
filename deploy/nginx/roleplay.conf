# 青笺前端：https://10.21.16.197 -> Next.js 127.0.0.1:3000
# 启用前必须先释放 443（当前由 llama.cpp 占用）。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl http2;
    server_name 10.21.16.197 localhost;

    # 证书与私钥复制到 /etc/nginx/tls，避免依赖 llama-service 目录权限
    ssl_certificate     /etc/nginx/tls/roleplay.crt;
    ssl_certificate_key /etc/nginx/tls/roleplay.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 与 Next 代理和后端过滤器保持一致：图片上传上限 64 MiB
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Next dev 的 HMR WebSocket；生产模式不使用
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # /api/chat 为 SSE，必须关闭缓冲并放宽超时
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
